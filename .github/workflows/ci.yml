name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-selftest:
    name: Python 自测（${{ matrix.python-version }}）
    # ubuntu-latest 已切到 26.04，setup-python 在该镜像上没有 3.9；
    # 固定 22.04 以保证 README 声明的 Python 3.9 兼容性仍被实际验证。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 账本要校验证据提交是否为 HEAD 的祖先，浅克隆会让这类检查全部失败。
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 运行自测
        run: python scripts/selftest.py

      - name: 运行反例夹具
        run: python scripts/anti_examples.py

      - name: 运行 init 自测
        run: bash tests/init-selftest.sh

      - name: 校验五个示例账本
        run: |
          python scripts/check_evidence.py examples/01-new-feature/07-验收回归清单.md
          python scripts/check_evidence.py examples/02-bug-fix/07-验收回归清单.md
          python scripts/check_evidence.py examples/03-blocking/07-验收回归清单.md
          python scripts/check_evidence.py examples/04-project-v1/07-验收回归清单.md
          python scripts/check_evidence.py examples/05-release/07-验收回归清单.md

      - name: 适配层与文档计数预检
        run: python scripts/verity.py doctor --root . --adapter tests/fixtures/valid-adapter.json

      # 本地 pre-push 可直接复制这一组 gate；PR/push 在 CI 强制执行同一检查。
      # 第一条 gate 与 README「可选：把完成线装成 pre-push」逐字一致，防止文档漂移。
      - name: README 命令漂移检查
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("README.md").read_text(encoding="utf-8")
          start = text.index("### 可选：把完成线装成 pre-push")
          block = text[start:].split("```sh", 1)[1].split("```", 1)[0]
          # 双反斜杠保留 shell 续行符；Python 三引号会把单个反斜杠加换行折叠成空格。
          expected = """python3 scripts/verity.py gate --root . \\
            --ledger examples/04-project-v1/07-验收回归清单.md \\
            --adapter tests/fixtures/valid-adapter.json --run --team --release"""
          assert expected in block, "README pre-push 命令已漂移"
          print("README pre-push 命令一致")
          PY

      - name: 本地完成线门禁
        run: |
          python scripts/verity.py gate --selftest
          python scripts/verity.py gate --root . --ledger examples/04-project-v1/07-验收回归清单.md --adapter tests/fixtures/valid-adapter.json --run
          python scripts/verity.py gate --root . --ledger examples/05-release/07-验收回归清单.md --adapter tests/fixtures/valid-adapter.json --run
          python scripts/package.py --selftest

  markdown-links:
    name: Markdown 链接
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 检查 Markdown 链接
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --max-retries 2 --timeout 20 './**/*.md'
          fail: true

  package-limits:
    name: 文件数与体积
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 安装 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: 检查打包上限
        run: python scripts/package.py --check

  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: 检出完整历史
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: 安装 gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: 扫描完整历史
        run: gitleaks detect --source . --redact --verbose --exit-code 1
